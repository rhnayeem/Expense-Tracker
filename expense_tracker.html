<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Expense Tracker (BDT)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 24px; color: #1e293b; }
    
    .btn { padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; }
    .btn-primary { background-color: #2563eb; color: white; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-secondary { background-color: #64748b; color: white; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-export { background-color: #10b981; color: white; }
    .btn-export:hover { background-color: #059669; }
    .btn-danger { background-color: #ef4444; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background-color: #dc2626; }

    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .card-title { font-size: 18px; font-weight: 700; color: #0f172a; }

    /* Form Styles */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: end; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 13px; font-weight: 600; color: #475569; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #2563eb; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-card h3 { font-size: 13px; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
    .stat-card p { font-size: 22px; font-weight: bold; color: #0f172a; }

    /* Filters & History Table */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { flex: 1; min-width: 150px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background-color: #f8fafc; color: #475569; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; background: #e2e8f0; color: #334155; font-weight: 600; display: inline-block; }
    .no-data { text-align: center; color: #94a3b8; padding: 20px; }
    .table-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 13px; color: #64748b; }

    /* Settings Modal */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .category-list { list-style: none; margin-top: 15px; max-height: 200px; overflow-y: auto; }
    .category-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }

    /* Simple auth UI */
    .auth-actions { display: flex; gap: 8px; align-items: center; }
    .auth-info { font-size: 14px; color: #475569; margin-right: 10px; }

    .small-modal { position: fixed; right: 20px; top: 70px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); display: none; z-index: 200; }
    .small-modal input { margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Expense-Tracker</h1>
    <div class="auth-actions">
      <div id="authInfo" class="auth-info">Guest</div>
      <button class="btn btn-secondary" id="openSettingsBtn">⚙️ Category Settings</button>
      <button class="btn btn-primary" id="signInBtn">Sign In</button>
      <button class="btn btn-secondary" id="signUpBtn">Sign Up</button>
      <button class="btn btn-danger" id="signOutBtn" style="display:none;">Sign Out</button>
    </div>
  </header>

  <!-- 1. FRONT & TOP: Add New Expense Form -->
  <div class="card">
    <div class="card-title" style="margin-bottom: 15px;">Add New Expense</div>
    <form id="expenseForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="expDate" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="expDesc" placeholder="e.g. Bazar, Rickshaw fare" required />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="expCategory" required></select>
        </div>
        <div class="form-group">
          <label>Amount (৳ BDT)</label>
          <input type="number" id="expAmount" step="0.01" min="0.01" placeholder="0.00" required />
        </div>
        <button type="submit" class="btn btn-primary" style="height: 42px;">+ Add Expense</button>
      </div>
    </form>
  </div>

  <!-- 2. Stats Summary (Calculated from ALL expenses) -->
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Total Spent</h3>
      <p id="totalSpent">৳0.00</p>
    </div>
    <div class="stat-card">
      <h3>Total Entries</h3>
      <p id="totalEntries">0</p>
    </div>
    <div class="stat-card">
      <h3>Average / Expense</h3>
      <p id="avgExpense">৳0.00</p>
    </div>
  </div>

  <!-- 3. Expense History (Only shows last 10 entries) -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div class="card-title">Recent Expenses (Last 10)</div>
      <button id="exportBtn" class="btn btn-export">Export CSV</button>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search expenses..." />
      <select id="categoryFilter"></select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="expenseTableBody"></tbody>
    </table>

    <div class="table-footer">
      <span id="showingCount">Showing 0 of 0 entries</span>
      <span style="font-style: italic;">Only displaying the 10 most recent transactions</span>
    </div>
  </div>
</div>

<!-- Settings Modal for Custom Categories -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h3 style="font-size: 18px;">Manage Categories</h3>
      <button id="closeSettingsBtn" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    <form id="addCategoryForm" style="display: flex; gap: 10px;">
      <input type="text" id="newCategoryInput" placeholder="New Category Name..." required />
      <button type="submit" class="btn btn-primary" style="white-space: nowrap;">Add</button>
    </form>
    <ul class="category-list" id="categoryList"></ul>
  </div>
</div>

<!-- Small Sign In / Sign Up Modals -->
<div class="small-modal" id="signInModal">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"><strong>Sign In</strong><button onclick="closeSignIn()" style="border:none;background:none;cursor:pointer">&times;</button></div>
  <input id="signInEmail" type="email" placeholder="Email" />
  <input id="signInPassword" type="password" placeholder="Password" />
  <button class="btn btn-primary" id="signInSubmit">Sign In</button>
</div>

<div class="small-modal" id="signUpModal">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"><strong>Sign Up</strong><button onclick="closeSignUp()" style="border:none;background:none;cursor:pointer">&times;</button></div>
  <input id="signUpEmail" type="email" placeholder="Email" />
  <input id="signUpPassword" type="password" placeholder="Password (6+ chars)" />
  <button class="btn btn-primary" id="signUpSubmit">Create Account</button>
</div>

<!-- Firebase SDKs will be loaded as ES modules in the script below -->

<script type="module">
  // =========== FIREBASE CONFIGURE HERE ============
  // IMPORTANT: DO NOT COMMIT real API keys to public repos. Replace the placeholders with your
  // Firebase web app config from Project Settings. Alternatively, keep the placeholders here
  // and paste the real config into the file locally before deploying.
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    // storageBucket, messagingSenderId, appId -- optional for this demo
  };

  // If the apiKey still starts with YOUR_ then we will NOT initialize Firebase and the app
  // will continue to work with localStorage only.
  const firebaseEnabled = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('YOUR_');

  if (firebaseEnabled) {
    // import from CDN (modular SDK)
    import('https://www.gstatic.com/firebasejs/9.24.0/firebase-app.js').then(({ initializeApp }) => {
      import('https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js').then(({ getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }) => {
        import('https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore.js').then(({ getFirestore, collection, addDoc, setDoc, doc, getDocs, query, orderBy, deleteDoc, onSnapshot, serverTimestamp }) => {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);

          // Expose firebase handles to outer scope functions
          window._firebase = { app, auth, db, functions: { addDoc, collection, doc, deleteDoc, query, orderBy, onSnapshot, getDocs, serverTimestamp } };

          // Listen for auth state changes
          onAuthStateChanged(auth, async (user) => {
            if (user) {
              currentUserUid = user.uid;
              authInfo.textContent = user.email;
              signInBtn.style.display = 'none';
              signUpBtn.style.display = 'none';
              signOutBtn.style.display = 'inline-block';

              // Load remote expenses and subscribe to live updates
              subscribeToRemoteExpenses(user.uid);

              // Offer to migrate local data if present
              const local = JSON.parse(localStorage.getItem('bdt_expenses') || '[]');
              if (local.length > 0) {
                const upload = confirm('Local transactions found. Upload local data to your cloud account? (Choose Cancel to keep local data)');
                if (upload) {
                  await uploadLocalToCloud(user.uid, local);
                } else {
                  // do nothing, user chose to keep local
                }
              }

            } else {
              // Signed out
              currentUserUid = null;
              authInfo.textContent = 'Guest';
              signInBtn.style.display = 'inline-block';
              signUpBtn.style.display = 'inline-block';
              signOutBtn.style.display = 'none';

              // Use localStorage data
              expenses = JSON.parse(localStorage.getItem('bdt_expenses')) || [];
              render();
            }
          });

        });
      });
    });
  } else {
    console.warn('Firebase not initialized - running in localStorage-only mode. Replace firebaseConfig with your values to enable cloud sync.');
  }

  // =========== END FIREBASE SETUP ============

  const DEFAULT_CATEGORIES = ["Food & Dining", "Transportation", "Utilities", "Shopping", "Entertainment", "Health", "Other"]; 

  let categories = JSON.parse(localStorage.getItem('bdt_categories')) || DEFAULT_CATEGORIES;
  let expenses = JSON.parse(localStorage.getItem('bdt_expenses')) || [];
  let currentUserUid = null; // set when signed in

  // DOM Elements
  const expDate = document.getElementById('expDate');
  const expDesc = document.getElementById('expDesc');
  const expCategory = document.getElementById('expCategory');
  const expAmount = document.getElementById('expAmount');
  const expenseForm = document.getElementById('expenseForm');
  
  const categoryFilter = document.getElementById('categoryFilter');
  const searchInput = document.getElementById('searchInput');
  const tableBody = document.getElementById('expenseTableBody');
  const showingCount = document.getElementById('showingCount');
  
  const settingsModal = document.getElementById('settingsModal');
  const openSettingsBtn = document.getElementById('openSettingsBtn');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const addCategoryForm = document.getElementById('addCategoryForm');
  const newCategoryInput = document.getElementById('newCategoryInput');
  const categoryList = document.getElementById('categoryList');

  const authInfo = document.getElementById('authInfo');
  const signInBtn = document.getElementById('signInBtn');
  const signUpBtn = document.getElementById('signUpBtn');
  const signOutBtn = document.getElementById('signOutBtn');

  const signInModal = document.getElementById('signInModal');
  const signUpModal = document.getElementById('signUpModal');
  const signInSubmit = document.getElementById('signInSubmit');
  const signUpSubmit = document.getElementById('signUpSubmit');

  // Set default date to today
  expDate.valueAsDate = new Date();

  // Format currency helper
  function formatBDT(amount) {
    return '৳' + Number(amount).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Populate Category Select Dropdowns
  function updateCategoryDropdowns() {
    expCategory.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
    categoryFilter.innerHTML = `<option value="ALL">All Categories</option>` + 
      categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
  }

  // Render Category Settings List
  function renderCategorySettings() {
    categoryList.innerHTML = categories.map((cat, index) => `
      <li class="category-item">
        <span>${cat}</span>
        <button class="btn btn-danger" onclick="deleteCategory(${index})">Remove</button>
      </li>
    `).join('');
  }

  // Add Category
  addCategoryForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const newCat = newCategoryInput.value.trim();
    if (newCat && !categories.includes(newCat)) {
      categories.push(newCat);
      localStorage.setItem('bdt_categories', JSON.stringify(categories));
      updateCategoryDropdowns();
      renderCategorySettings();
      newCategoryInput.value = '';
    }
  });

  // Delete Category
  window.deleteCategory = function(index) {
    if (categories.length <= 1) {
      alert('You must have at least one category.');
      return;
    }
    categories.splice(index, 1);
    localStorage.setItem('bdt_categories', JSON.stringify(categories));
    updateCategoryDropdowns();
    renderCategorySettings();
  }

  // Add Expense
  expenseForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newExpense = {
      id: 'local-' + Date.now(),
      date: expDate.value,
      description: expDesc.value.trim(),
      category: expCategory.value,
      amount: parseFloat(expAmount.value),
      createdAt: Date.now(),
      remoteId: null
    };

    expenses.unshift(newExpense);
    saveAndRender();

    // If signed in and firebase available, push to Firestore and update local record with remoteId
    if (currentUserUid && window._firebase) {
      try {
        const { addDoc, collection } = window._firebase.functions;
        const docRef = await addDoc(collection(window._firebase.db, 'users', currentUserUid, 'expenses'), {
          date: newExpense.date,
          description: newExpense.description,
          category: newExpense.category,
          amount: newExpense.amount,
          createdAt: window._firebase.functions.serverTimestamp ? window._firebase.functions.serverTimestamp() : Date.now()
        });
        // store remoteId in local copy
        const idx = expenses.findIndex(it => it.id === newExpense.id);
        if (idx !== -1) {
          expenses[idx].remoteId = docRef.id;
          localStorage.setItem('bdt_expenses', JSON.stringify(expenses));
          render();
        }
      } catch (err) {
        console.error('Failed to push expense to cloud', err);
      }
    }

    expenseForm.reset();
    expDate.valueAsDate = new Date();
  });

  // Delete Expense
  window.deleteExpense = async function(id) {
    // find item
    const item = expenses.find(it => it.id === id || it.remoteId === id);
    if (!item) return;

    // remove locally
    expenses = expenses.filter(it => !(it.id === id || it.remoteId === id));
    saveAndRender();

    // delete from Firestore if remoteId exists and user signed in
    if (currentUserUid && item.remoteId && window._firebase) {
      try {
        const { deleteDoc, doc } = window._firebase.functions;
        await deleteDoc(doc(window._firebase.db, 'users', currentUserUid, 'expenses', item.remoteId));
      } catch (err) {
        console.error('Failed to delete remote expense', err);
      }
    }
  }

  // Save to LocalStorage & Render Dashboard
  function saveAndRender() {
    localStorage.setItem('bdt_expenses', JSON.stringify(expenses));
    render();
  }

  // Render Expenses Table & Statistics
  function render() {
    const searchTerm = searchInput.value.toLowerCase();
    const selectedCategory = categoryFilter.value;

    // Filter matching expenses
    const filtered = expenses.filter(exp => {
      const matchesSearch = exp.description.toLowerCase().includes(searchTerm);
      const matchesCategory = selectedCategory === 'ALL' || exp.category === selectedCategory;
      return matchesSearch && matchesCategory;
    });

    // Calculate overall Statistics from all filtered entries
    const total = filtered.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    const count = filtered.length;
    const avg = count > 0 ? total / count : 0;

    document.getElementById('totalSpent').textContent = formatBDT(total);
    document.getElementById('totalEntries').textContent = count;
    document.getElementById('avgExpense').textContent = formatBDT(avg);

    // Take only the top 10 most recent entries
    const recentTen = filtered.slice(0, 10);

    showingCount.textContent = `Showing ${recentTen.length} of ${count} entries`;

    // Render Table Rows
    if (recentTen.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="5" class="no-data">No expenses found.</td></tr>`;
      return;
    }

    tableBody.innerHTML = recentTen.map(item => `
      <tr>
        <td>${item.date}</td>
        <td>${item.description}</td>
        <td><span class="badge">${item.category}</span></td>
        <td><strong>${formatBDT(item.amount)}</strong></td>
        <td><button class="btn btn-danger" onclick="deleteExpense('${item.id || item.remoteId}')">Delete</button></td>
      </tr>
    `).join('');
  }

  // Event Listeners
  searchInput.addEventListener('input', render);
  categoryFilter.addEventListener('change', render);

  openSettingsBtn.addEventListener('click', () => {
    renderCategorySettings();
    settingsModal.style.display = 'flex';
  });

  closeSettingsBtn.addEventListener('click', () => {
    settingsModal.style.display = 'none';
  });

  // Export CSV Functionality (exports ALL stored expenses, not just 10)
  document.getElementById('exportBtn').addEventListener('click', () => {
    if (expenses.length === 0) return alert('No data available to export.');
    let csv = 'Date,Description,Category,Amount (BDT)\n';
    expenses.forEach(e => {
      csv += `"${e.date}","${e.description}","${e.category}",${e.amount}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `expenses_bdt_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  });

  // ========== Firebase helpers (used when firebase initialized) ==========
  async function subscribeToRemoteExpenses(uid) {
    if (!window._firebase) return;
    const { collection, query, orderBy, onSnapshot } = window._firebase.functions;
    const q = query(collection(window._firebase.db, 'users', uid, 'expenses'), orderBy('createdAt', 'desc'));
    // live subscription
    onSnapshot(q, (snapshot) => {
      const remote = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      // normalize: ensure amount is number
      remote.forEach(r => { r.amount = Number(r.amount); r.remoteId = r.id; });
      expenses = remote;
      // persist a copy locally as cache
      localStorage.setItem('bdt_expenses', JSON.stringify(expenses));
      render();
    }, (err) => {
      console.error('Remote snapshot error', err);
    });
  }

  async function uploadLocalToCloud(uid, localArray) {
    if (!window._firebase) return;
    const { collection, addDoc } = window._firebase.functions;
    try {
      for (const item of localArray) {
        await addDoc(collection(window._firebase.db, 'users', uid, 'expenses'), {
          date: item.date,
          description: item.description,
          category: item.category,
          amount: item.amount,
          createdAt: item.createdAt || Date.now()
        });
      }
      // after upload, remote subscription will replace local expenses
      alert('Uploaded local transactions to cloud.');
    } catch (err) {
      console.error('Failed to upload local data', err);
      alert('Failed to upload local data: ' + err.message);
    }
  }

  // ========== Basic Auth UI handlers (no-credentials stored) ============
  function openSignIn() { signInModal.style.display = 'block'; }
  function closeSignIn() { signInModal.style.display = 'none'; }
  function openSignUp() { signUpModal.style.display = 'block'; }
  function closeSignUp() { signUpModal.style.display = 'none'; }

  signInBtn.addEventListener('click', () => { openSignIn(); });
  signUpBtn.addEventListener('click', () => { openSignUp(); });
  signOutBtn.addEventListener('click', async () => {
    if (window._firebase) {
      try { await window._firebase.app ? window._firebase.app : null; } catch(e){}
      try { await (await import('https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js')).signOut((await import('https://www.gstatic.com/firebasejs/9.24.0/firebase-app.js')).getApp()); } catch(e){}
    }
    // fallback: if auth isn't initialized just clear currentUid and revert to local
    currentUserUid = null;
    authInfo.textContent = 'Guest';
    signInBtn.style.display = 'inline-block';
    signUpBtn.style.display = 'inline-block';
    signOutBtn.style.display = 'none';
    expenses = JSON.parse(localStorage.getItem('bdt_expenses')) || [];
    render();
  });

  signInSubmit.addEventListener('click', async () => {
    if (!firebaseEnabled) return alert('Firebase is not configured. Paste your firebaseConfig to enable cloud features.');
    const email = document.getElementById('signInEmail').value;
    const password = document.getElementById('signInPassword').value;
    try {
      const { getAuth, signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js');
      const auth = getAuth();
      await signInWithEmailAndPassword(auth, email, password);
      closeSignIn();
    } catch (err) {
      alert('Sign in failed: ' + err.message);
    }
  });

  signUpSubmit.addEventListener('click', async () => {
    if (!firebaseEnabled) return alert('Firebase is not configured. Paste your firebaseConfig to enable cloud features.');
    const email = document.getElementById('signUpEmail').value;
    const password = document.getElementById('signUpPassword').value;
    try {
      const { getAuth, createUserWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js');
      const auth = getAuth();
      await createUserWithEmailAndPassword(auth, email, password);
      closeSignUp();
    } catch (err) {
      alert('Sign up failed: ' + err.message);
    }
  });

  function closeSignIn() { signInModal.style.display = 'none'; }
  function closeSignUp() { signUpModal.style.display = 'none'; }

  // Initial Initialization
  updateCategoryDropdowns();
  render();
</script>

</body>
</html>
